[project]
name = "nova-backend"
version = "0.1.0"
description = "NOVA local inference optimizer API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/src/nova_backend"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/backend"]
